<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Board</title>
<style>
  :root { --bg: #444; --fg: #fff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; transition: background .3s;
  }
  h1 { font-size: clamp(3rem, 12vw, 10rem); margin: 0; line-height: 1; letter-spacing: -.02em; text-transform: uppercase; }
  p  { font-size: clamp(1.2rem, 3.5vw, 2.5rem); margin: .6em 0 0; opacity: .9; }
  #editBtn {
    position: fixed; right: 16px; bottom: 16px; padding: 8px 14px;
    background: rgba(0,0,0,.25); color: inherit; border: 1px solid currentColor;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  dialog { border: 0; border-radius: 12px; padding: 24px; width: min(420px, 92vw); color: #111; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  label { display: block; margin-top: 12px; font-size: 13px; font-weight: 600; }
  input[type=text] { width: 100%; padding: 8px; font-size: 16px; margin-top: 4px; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .presets button { padding: 6px 10px; border: 2px solid #0002; border-radius: 6px; color: #fff; cursor: pointer; font-weight: 600; }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .row button { padding: 8px 14px; font-size: 15px; cursor: pointer; }
  #err { color: #b00020; font-size: 13px; margin-top: 8px; min-height: 1em; }
</style>
</head>
<body>
  <main>
    <h1 id="title">Loading…</h1>
    <p id="subtitle"></p>
  </main>
  <button id="editBtn">Edit status</button>

  <dialog id="dlg">
    <form method="dialog" id="form">
      <h3 style="margin:0">Update status</h3>
      <label>Quick presets
        <div class="presets" id="presets"></div>
      </label>
      <label>Title <input type="text" id="fTitle" maxlength="60" required></label>
      <label>Subtitle <input type="text" id="fSub" maxlength="200"></label>
      <label>Color <input type="color" id="fColor" style="width:100%;height:40px;margin-top:4px"></label>
      <div id="err"></div>
      <div class="row">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" id="save">Save</button>
      </div>
    </form>
  </dialog>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

// ---- CONFIG: paste from Supabase > Project Settings > API (anon key is safe to expose) ----
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-KEY";
// -----------------------------------------------------------------------------------------

const PRESETS = [
  { title: "Code Freeze",    subtitle: "Do not merge to main.",           color: "#d32f2f" },
  { title: "Feature Freeze", subtitle: "Bug fixes only.",                 color: "#ef6c00" },
  { title: "All Clear",      subtitle: "Ship it.",                        color: "#2e7d32" },
];

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
let current = { title: "", subtitle: "", color: "#444444" };

function textColorFor(hex) {
  const n = parseInt(hex.slice(1), 16);
  const [r, g, b] = [n >> 16, (n >> 8) & 255, n & 255];
  return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? "#111" : "#fff";
}

function render(s) {
  current = s;
  document.documentElement.style.setProperty("--bg", s.color);
  document.documentElement.style.setProperty("--fg", textColorFor(s.color));
  $("title").textContent = s.title;
  $("subtitle").textContent = s.subtitle || "";
  document.title = s.title;
}

async function load() {
  const { data, error } = await sb.from("status").select("title,subtitle,color").eq("id", 1).single();
  if (error) { $("title").textContent = "Error"; $("subtitle").textContent = error.message; return; }
  render(data);
}

// live updates for everyone with the page open
sb.channel("status-changes")
  .on("postgres_changes", { event: "UPDATE", schema: "public", table: "status" }, (p) => render(p.new))
  .subscribe();

// presets
for (const p of PRESETS) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = p.title; b.style.background = p.color;
  b.onclick = () => { $("fTitle").value = p.title; $("fSub").value = p.subtitle; $("fColor").value = p.color; };
  $("presets").appendChild(b);
}

$("editBtn").onclick = () => {
  $("fTitle").value = current.title; $("fSub").value = current.subtitle || ""; $("fColor").value = current.color;
  $("err").textContent = ""; $("dlg").showModal();
};
$("cancel").onclick = () => $("dlg").close();
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("save").disabled = true;
  const next = { title: $("fTitle").value.trim(), subtitle: $("fSub").value.trim(), color: $("fColor").value };
  const { error } = await sb.from("status").update({ ...next, updated_at: new Date().toISOString() }).eq("id", 1);
  $("save").disabled = false;
  if (error) { $("err").textContent = error.message; return; }
  render(next); $("dlg").close();
});

load();
</script>
</body>
</html>
