<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Board</title>
<style>
  :root { --bg: #444; --fg: #fff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; transition: background .4s, color .4s;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: clamp(3rem, 12vw, 9rem); margin: 0; line-height: 1; letter-spacing: -.035em; font-weight: 800; text-transform: uppercase; }
  p  { font-size: clamp(1.1rem, 3vw, 2rem); margin: .8em 0 0; opacity: .85; font-weight: 500; }
  #editBtn {
    position: fixed; right: 20px; bottom: 20px; padding: 10px 18px;
    background: color-mix(in srgb, var(--fg) 14%, transparent); color: var(--fg);
    border: 1px solid color-mix(in srgb, var(--fg) 30%, transparent);
    border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; font-family: inherit;
    backdrop-filter: blur(8px); transition: background .2s;
  }
  #editBtn:hover { background: color-mix(in srgb, var(--fg) 24%, transparent); }

  dialog { border: 0; border-radius: 20px; padding: 28px; width: min(440px, 92vw); color: #0f172a; background: #fff; box-shadow: 0 24px 60px rgba(0,0,0,.35); font-family: inherit; text-align: left; }
  dialog::backdrop { background: rgba(15,23,42,.55); backdrop-filter: blur(4px); }
  h3 { margin: 0 0 4px; font-size: 20px; letter-spacing: -.01em; }
  .hint { margin: 0 0 18px; font-size: 14px; color: #64748b; opacity: 1; font-weight: 400; }
  .presets { display: flex; flex-direction: column; gap: 10px; }
  .presets button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; text-align: left; background: #f8fafc; border: 2px solid transparent; border-radius: 14px; cursor: pointer; font-family: inherit; color: #0f172a; transition: background .15s; }
  .presets b { display: block; font-size: 16px; }
  .presets small { display: block; font-size: 13px; color: #64748b; margin-top: 2px; }
  .presets button:hover { background: #e2e8f0; }
  .presets button.active { border-color: #0f172a; background: #fff; }
  .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; }
  .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 26px; }
  .row button { padding: 11px 20px; font-weight: 600; font-size: 15px; font-family: inherit; border-radius: 10px; cursor: pointer; border: 0; }
  #cancel { background: #f1f5f9; color: #0f172a; }
  #save { background: #0f172a; color: #fff; }
  #save:disabled { opacity: .6; }
  #err { color: #b91c1c; font-size: 13px; margin-top: 10px; min-height: 1em; }
</style>
</head>
<body>
  <main>
    <h1 id="title">Loading…</h1>
    <p id="subtitle"></p>
  </main>
  <button id="editBtn">Update status</button>

  <dialog id="dlg">
    <form method="dialog" id="form">
      <h3>Update status</h3>
      <p class="hint">Pick a status. Everyone sees it as soon as you save.</p>
      <div class="presets" id="presets"></div>
      <div id="err"></div>
      <div class="row">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" id="save" disabled>Save</button>
      </div>
    </form>
  </dialog>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// ---- CONFIG: paste from Supabase > Project Settings > API (anon key is safe to expose) ----
const SUPABASE_URL = "https://mjinjpyzxzipbslvpakx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_fSbDFbSu73dNeTG6ZBsn5Q_1pOc40b0";
// -----------------------------------------------------------------------------------------

const PRESETS = [
  { title: "Code Freeze",    subtitle: "Pushing not allowed currently.", color: "#d32f2f" },
  { title: "Feature Freeze", subtitle: "Bug fixes only.",                 color: "#ef6c00" },
  { title: "All Clear",      subtitle: "Ship it.",                        color: "#2e7d32" },
];

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
let current = { title: "", subtitle: "", color: "#444444" };

function textColorFor(hex) {
  const n = parseInt(hex.slice(1), 16);
  const [r, g, b] = [n >> 16, (n >> 8) & 255, n & 255];
  return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? "#111" : "#fff";
}

function render(s) {
  current = s;
  document.documentElement.style.setProperty("--bg", s.color);
  document.documentElement.style.setProperty("--fg", textColorFor(s.color));
  $("title").textContent = s.title;
  $("subtitle").textContent = s.subtitle || "";
  document.title = s.title;
}

async function load() {
  const { data, error } = await sb.from("status").select("title,subtitle,color").eq("id", 1).single();
  if (error) { $("title").textContent = "Error"; $("subtitle").textContent = error.message; return; }
  render(data);
}

// live updates for everyone with the page open
sb.channel("status-changes")
  .on("postgres_changes", { event: "UPDATE", schema: "public", table: "status" }, (p) => render(p.new))
  .subscribe();

// presets (only these can be chosen from the UI)
let selected = null;
for (const p of PRESETS) {
  const b = document.createElement("button");
  b.type = "button";
  b.innerHTML = `<span class="dot" style="background:${p.color}"></span><span><b>${p.title}</b><small>${p.subtitle}</small></span>`;
  b.onclick = () => {
    selected = p;
    for (const el of $("presets").children) el.classList.remove("active");
    b.classList.add("active"); $("save").disabled = false;
  };
  $("presets").appendChild(b);
}

$("editBtn").onclick = () => {
  selected = null; $("save").disabled = true; $("err").textContent = "";
  for (const el of $("presets").children) el.classList.remove("active");
  $("dlg").showModal();
};
$("cancel").onclick = () => $("dlg").close();
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!selected) return;
  $("save").disabled = true;
  const next = { title: selected.title, subtitle: selected.subtitle, color: selected.color };
  const { error } = await sb.from("status").update({ ...next, updated_at: new Date().toISOString() }).eq("id", 1);
  if (error) { $("err").textContent = error.message; $("save").disabled = false; return; }
  render(next); $("dlg").close();
});

load();
</script>
</body>
</html>
